PackageName: org.prauga.photos
Name: Photos
Summary: A fast, private gallery for your photos and videos
License: Apache-2.0
AuthorName: Saalim Quadri
SourceCode: https://github.com/PVOT-OSS/Photos
IssueTracker: https://github.com/PVOT-OSS/Photos/issues
WebSite: ""
Categories:
  - Gallery
CurrentVersion: "1.1.0"
CurrentVersionCode: 10100
Description: |
  Photos shows the pictures and videos on your phone in one timeline, with
  Years, Months and All views, pinch to resize the grid, a fast scroller,
  Favourites, Videos and folder albums, and a viewer with zoom, swipe to
  close, a filmstrip, photo info and video playback. It has no internet
  permission: no account, no ads, no tracking.

RepoType: git
Repo: https://github.com/PVOT-OSS/Photos.git

